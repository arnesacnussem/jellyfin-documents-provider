name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        run: echo "$SIGNING_KEY" | base64 -d > release-keystore.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build signed release APK
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          ./gradlew assembleRelease \
            -PversionName="$TAG_VERSION" \
            -PversionCode=${{ github.run_number }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for release
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/JellyfinDocumentsProvider-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          files: app/build/outputs/apk/release/JellyfinDocumentsProvider-${{ github.ref_name }}.apk
