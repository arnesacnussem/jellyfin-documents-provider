name: Build APK

on:
  push:
    branches: [ "main", "thesecondchance" ]
  pull_request:
    branches: [ "main", "thesecondchance" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReport
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release keystore
        if: github.ref == 'refs/heads/main'
        run: echo "$SIGNING_KEY" | base64 -d > release-keystore.jks
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload unsigned debug APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Upload unsigned release APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false

      - name: Upload unsigned release mapping
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-release-unsigned
          path: app/build/outputs/mapping/release/mapping.txt
          archive: false

      - name: Upload debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: JellyfinDocumentsProvider-nightly.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Upload signed release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: JellyfinDocumentsProvider-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          archive: false

      - name: Upload signed release mapping
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          archive: false
