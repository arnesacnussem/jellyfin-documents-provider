name: Build APK

on:
  push:
    branches: [ "main", "thesecondchance" ]
  pull_request:
    branches: [ "main", "thesecondchance" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReport
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload unsigned APK (artifact)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-unsigned
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        if: github.ref == 'refs/heads/main'
        id: sign_debug
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload signed APK (artifact)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: JellyfinDocumentsProvider-nightly.apk
          path: ${{ steps.sign_debug.outputs.signedReleaseFile }}
          archive: false
